# Dex/R8 needs ~1GB; keep SerialGC to limit native overhead on 6GB machines.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
org.gradle.daemon=true
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC

android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
